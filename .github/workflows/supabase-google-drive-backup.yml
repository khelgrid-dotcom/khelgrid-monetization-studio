name: Supabase Daily Backup to Google Drive

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: \${{ secrets.SUPABASE_DB_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: \${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_DRIVE_FOLDER_ID"

      - name: Create database dump
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql -x "storage.buckets_vectors" -x "storage.vector_indexes"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backup/created_at.txt

      - name: Compress backup
        run: |
          set -euo pipefail
          BACKUP_DATE="$(date -u +%Y-%m-%d)"
          ARCHIVE="khelgrid-supabase-\${BACKUP_DATE}.tar.gz"
          tar -czf "$ARCHIVE" -C backup .
          sha256sum "$ARCHIVE" > "\${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload backup to Google Drive
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request, uuid, subprocess
          service=json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          folder=os.environ["GOOGLE_DRIVE_FOLDER_ID"]
          archive=os.environ["ARCHIVE"]
          def b64url(x): return base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          now=int(time.time())
          h=b64url(json.dumps({"alg":"RS256","typ":"JWT"}).encode())
          p=b64url(json.dumps({"iss":service["client_email"],"scope":"https://www.googleapis.com/auth/drive.file","aud":"https://oauth2.googleapis.com/token","iat":now,"exp":now+3600}).encode())
          key="/tmp/google-drive-key.pem"
          open(key,"w").write(service["private_key"])
          sig=subprocess.check_output(["openssl","dgst","-sha256","-sign",key],input=(h+"."+p).encode())
          assertion=h+"."+p+"."+b64url(sig)
          req=urllib.request.Request("https://oauth2.googleapis.com/token",data=urllib.parse.urlencode({"grant_type":"urn:ietf:params:oauth:grant-type:jwt-bearer","assertion":assertion}).encode(),headers={"Content-Type":"application/x-www-form-urlencoded"},method="POST")
          token=json.load(urllib.request.urlopen(req,timeout=60))["access_token"]
          boundary="----KhelGrid"+uuid.uuid4().hex
          metadata=json.dumps({"name":archive,"parents":[folder]}).encode()
          data=open(archive,"rb").read()
          body=(("--"+boundary+"\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n").encode()+metadata+("\\r\\n--"+boundary+"\\r\\nContent-Type: application/gzip\\r\\n\\r\\n").encode()+data+("\\r\\n--"+boundary+"--\\r\\n").encode())
          req=urllib.request.Request("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",data=body,headers={"Authorization":"Bearer "+token,"Content-Type":"multipart/related; boundary="+boundary},method="POST")
          result=json.load(urllib.request.urlopen(req,timeout=300))
          print("Uploaded",archive,result.get("id"))
          PY

      - name: Remove local backup files
        if: always()
        run: rm -rf backup *.tar.gz *.sha256
