<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 160 160" width="100%" height="100%">
  <defs>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    :root {
      --dark-fill: #18181B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --dark-fill: #FFFFFF;
      }
    }
    .kg-bar-dark {
      fill: var(--dark-fill);
      transition: fill 0.2s ease;
    }
  </style>

  <g filter="url(#subtle-glow)">
    <!-- Blue vertical bar (left) -->
    <polygon points="50,80 70,60 70,140 50,160" fill="#0066FF"/>
    
    <!-- Top horizontal bar (adaptive: dark on light tab, white on dark tab) -->
    <polygon class="kg-bar-dark" points="70,60 130,40 130,80 70,100"/>
    
    <!-- Red bar (upper right) -->
    <polygon points="130,80 160,60 180,100 150,120" fill="#EF4444"/>
    
    <!-- Yellow/Amber bar (bottom left) -->
    <polygon points="50,160 90,140 110,160 70,180" fill="#FBBF24"/>
    
    <!-- Green arrow (right) -->
    <polygon points="150,120 180,100 160,140 130,160" fill="#10B981"/>
    <polygon points="180,100 190,110 170,145 160,140" fill="#10B981"/>
  </g>
</svg>
