<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" stop-opacity="1" />
      <stop offset="40%" stop-color="#091424" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#071b1d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#040911" stop-opacity="1" />
    </linearGradient>

    <!-- Stadium Floodlight Beams -->
    <radialGradient id="floodlight-left" cx="12%" cy="5%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#0369a1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="floodlight-right" cx="88%" cy="5%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="floodlight-center" cx="50%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Turf Glow Gradient -->
    <linearGradient id="turf-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.06" />
    </linearGradient>

    <!-- Glowing Speed trails -->
    <linearGradient id="trail-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="trail-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Night Sky -->
  <rect width="1920" height="900" fill="url(#bg-grad)" />

  <!-- Stadium Floodlight Cones -->
  <polygon points="180,0 0,650 600,750" fill="url(#floodlight-left)" opacity="0.85" />
  <polygon points="1740,0 2000,700 1300,750" fill="url(#floodlight-right)" opacity="0.85" />
  <ellipse cx="960" cy="180" rx="700" ry="250" fill="url(#floodlight-center)" opacity="0.75" />

  <!-- Stadium Arena Grid & Field Markings -->
  <g opacity="0.22" stroke="#34d399" stroke-width="1.5" fill="none">
    <!-- Curved Track Lines -->
    <path d="M-100,780 C400,680 1520,680 2020,780" />
    <path d="M-100,820 C420,720 1500,720 2020,820" />
    <path d="M-100,860 C440,760 1480,760 2020,860" />
    
    <!-- Perspective Field Stripes -->
    <path d="M760,690 L520,900" stroke-dasharray="8 8" />
    <path d="M1160,690 L1400,900" stroke-dasharray="8 8" />
    <ellipse cx="960" cy="740" rx="160" ry="40" stroke="#38bdf8" stroke-width="2" />
    <line x1="960" y1="700" x2="960" y2="820" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Glowing Turf Horizon -->
  <ellipse cx="960" cy="850" rx="1200" ry="250" fill="url(#turf-glow)" />

  <!-- High-Energy Speed Streaks & Arcs -->
  <g filter="url(#glow-blur)">
    <!-- Arc across arena -->
    <path d="M120,620 Q 550,280 1020,410 T 1840,490" fill="none" stroke="url(#trail-teal)" stroke-width="3.5" opacity="0.75" />
    <path d="M150,650 Q 620,330 1100,440 T 1800,530" fill="none" stroke="url(#trail-orange)" stroke-width="2" opacity="0.6" />
    <path d="M80,500 Q 400,200 950,260 T 1880,380" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.5" />
  </g>

  <!-- Athlete Silhouettes & Sports Action Figures -->
  <!-- 1. Football Striker (Left side: Volley / bicycle kick action) -->
  <g transform="translate(190, 360) scale(0.68)" fill="#e2e8f0" opacity="0.5" filter="url(#glow-blur)">
    <!-- Motion Trail -->
    <path d="M-40,160 Q 20,80 110,60" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.8" />
    <!-- Footballer Silhouette -->
    <!-- Head -->
    <circle cx="110" cy="65" r="14" fill="#f8fafc" />
    <!-- Torso -->
    <path d="M102,78 L65,130 L95,150 L120,95 Z" fill="#f8fafc" />
    <!-- Left Arm -->
    <path d="M108,85 L145,95 L170,80" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Right Arm -->
    <path d="M90,92 L60,82 L35,90" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Kicking Leg (extended high) -->
    <path d="M85,142 L130,120 L185,75" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Plant Leg -->
    <path d="M70,145 L40,185 L55,225" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Soccer Ball with speed aura -->
    <circle cx="215" cy="55" r="13" fill="#ffffff" />
    <circle cx="215" cy="55" r="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  </g>

  <!-- 2. Cricket Batter (Left-Center: Powerful cover drive / pull shot) -->
  <g transform="translate(380, 410) scale(0.65)" fill="#f1f5f9" opacity="0.45" filter="url(#glow-blur)">
    <!-- Head with Helmet -->
    <circle cx="100" cy="70" r="15" fill="#f8fafc" />
    <path d="M105,68 L122,74" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <!-- Torso -->
    <path d="M95,84 L80,140 L115,145 L118,92 Z" fill="#f8fafc" />
    <!-- Arms holding bat -->
    <path d="M105,92 L135,115 L145,135" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M92,95 L115,120 L138,135" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Cricket Bat -->
    <polygon points="140,130 190,90 200,98 148,140" fill="#f59e0b" opacity="0.9" />
    <!-- Legs in batting stance -->
    <path d="M85,142 L65,190 L50,230" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M112,144 L145,185 L160,225" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Glowing Cricket Ball -->
    <circle cx="240" cy="70" r="9" fill="#ef4444" />
    <line x1="240" y1="70" x2="310" y2="45" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- 3. Sprinter / Runner (Center-Right: Fast dynamic sprint burst) -->
  <g transform="translate(1380, 420) scale(0.65)" fill="#f8fafc" opacity="0.45" filter="url(#glow-blur)">
    <!-- Sprinter speed lines behind -->
    <line x1="-30" y1="90" x2="40" y2="90" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="-50" y1="130" x2="30" y2="130" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="-20" y1="170" x2="50" y2="170" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <!-- Head forward lean -->
    <circle cx="120" cy="75" r="14" fill="#f8fafc" />
    <!-- Torso leaning -->
    <path d="M110,88 L70,135 L95,145 L125,96 Z" fill="#f8fafc" />
    <!-- Leading Arm -->
    <path d="M115,95 L145,115 L165,100" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Trailing Arm -->
    <path d="M85,105 L55,115 L35,135" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Front Stride Leg -->
    <path d="M92,142 L135,160 L140,210" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Back Drive Leg -->
    <path d="M75,140 L35,170 L0,185" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none" />
  </g>

  <!-- 4. Badminton / Tennis Player (Right side: Jump smash / spike) -->
  <g transform="translate(1600, 360) scale(0.65)" fill="#f8fafc" opacity="0.48" filter="url(#glow-blur)">
    <!-- Head -->
    <circle cx="95" cy="70" r="14" fill="#f8fafc" />
    <!-- Torso arching back -->
    <path d="M92,85 L80,135 L108,140 L112,90 Z" fill="#f8fafc" />
    <!-- Leaping Legs -->
    <path d="M82,138 L65,185 L50,225" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M102,140 L115,180 L135,215" stroke="#a855f7" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Non-racket arm balancing -->
    <path d="M85,92 L60,85 L45,105" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Smash Arm reaching up -->
    <path d="M108,88 L125,50 L140,20" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Racket & Shuttlecock / Ball -->
    <line x1="140" y1="20" x2="165" y2="-5" stroke="#a855f7" stroke-width="4" />
    <ellipse cx="180" cy="-20" rx="14" ry="18" fill="none" stroke="#a855f7" stroke-width="3" transform="rotate(30 180 -20)" />
    <!-- Shuttlecock / Tennis ball glowing -->
    <circle cx="210" cy="-35" r="7" fill="#38bdf8" />
    <path d="M210,-35 L235,-45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Ambient Light Sparks & Stardust Particles -->
  <g opacity="0.75">
    <circle cx="320" cy="240" r="3" fill="#38bdf8" />
    <circle cx="480" cy="180" r="2" fill="#34d399" />
    <circle cx="640" cy="290" r="2.5" fill="#f59e0b" />
    <circle cx="820" cy="220" r="3.5" fill="#10b981" />
    <circle cx="1120" cy="210" r="3" fill="#a855f7" />
    <circle cx="1280" cy="280" r="2.5" fill="#38bdf8" />
    <circle cx="1450" cy="190" r="3" fill="#10b981" />
    <circle cx="1580" cy="250" r="2" fill="#ec4899" />
    <circle cx="1720" cy="310" r="3" fill="#34d399" />
    <circle cx="210" cy="480" r="2" fill="#60a5fa" />
    <circle cx="950" cy="450" r="2.5" fill="#34d399" />
    <circle cx="1680" cy="460" r="2" fill="#c084fc" />
  </g>

  <!-- Vignette Gradient Overlays: Ensure crisp contrast for UI overlay -->
  <linearGradient id="vignette-top" x1="0" y1="0" x2="0" y2="100%">
    <stop offset="0%" stop-color="#050811" stop-opacity="0.85" />
    <stop offset="40%" stop-color="#050811" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#050811" stop-opacity="0.75" />
  </linearGradient>
  <rect width="1920" height="900" fill="url(#vignette-top)" />
</svg>
